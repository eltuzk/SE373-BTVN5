[project]
name = "d05-tool-use-skill-use"
version = "0.1.0"
description = "Bài luyện tập D05 Tool Use & Skill Use: block 1 (list_files + refund-policy) và block 2 (csv-quality quá tải theo người)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "block-1/stage-00-chat",
    "block-1/stage-01-files",
    "block-1/stage-02-skills",
    "block-2/stage-03-bash",
    "block-2/stage-04-script-skill",
]
